<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Säljklart – AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f6;color:#14201a}
.wrap{max-width:820px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;padding:8px 0 25px}.logo{font-size:25px;font-weight:900}.logo span{color:#18a36b}.tag{font-size:11px;background:#e5f7ee;color:#16784f;padding:7px 10px;border-radius:999px;font-weight:800}
.hero{text-align:center;padding:35px 0}.hero h1{font-size:clamp(40px,10vw,70px);line-height:1;letter-spacing:-3px;margin:0 0 16px}.hero h1 span{color:#18a36b}.hero p{color:#66736c;font-size:18px;line-height:1.5}
.card{background:#fff;border:1px solid #e1e8e3;border-radius:22px;padding:22px;box-shadow:0 12px 35px #14201a10}label{display:block;font-weight:800;margin:16px 0 8px}
.drop{border:2px dashed #cbd8d1;border-radius:16px;padding:28px;text-align:center;cursor:pointer}.drop:hover{border-color:#18a36b}.drop b{display:block}.drop small{color:#748078}
input,textarea{width:100%;padding:14px;border:1px solid #d7e0da;border-radius:12px;font:inherit}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{outline:none;border-color:#18a36b;box-shadow:0 0 0 3px #18a36b18}
button{border:0;border-radius:13px;padding:15px;font:inherit;font-weight:850;cursor:pointer}.primary{width:100%;background:#18a36b;color:white;margin-top:20px}.primary:disabled{opacity:.6;cursor:wait}
#preview{display:none;margin-top:10px}#preview img{max-width:100%;max-height:280px;border-radius:14px;display:block;margin:auto}
.result{display:none;margin-top:20px}.output{white-space:pre-wrap;background:#f5f7f6;border-radius:15px;padding:17px;line-height:1.55}.price{font-size:24px;font-weight:900;margin:8px 0 15px}.notice{font-size:13px;color:#718078;margin-top:12px}
</style>
</head>
<body><div class="wrap">
<header><div class="logo">Sälj<span>klart</span></div><div class="tag">AI-PROTOTYP</div></header>
<section class="hero"><h1>Har du något att sälja?<br><span>Vi gör annonsen åt dig.</span></h1><p>En bild och några ord räcker. Säljklart använder AI för att skapa en färdig annons.</p></section>
<div class="card">
<label>📸 Bild på det du säljer</label>
<div class="drop" id="drop" onclick="file.click()"><b>Lägg till en bild</b><small>Välj en bild från mobilen</small><input id="file" type="file" accept="image/*" hidden></div>
<div id="preview"><img id="photo"></div>
<label>🏷️ Vad säljer du?</label><input id="item" placeholder="T.ex. Samsung 55 tum TV">
<label>📝 Berätta lite om prylen</label><textarea id="desc" placeholder="Skriv med dina egna ord. Det behöver inte vara snyggt."></textarea>
<label>💰 Vad vill du ha för den?</label><input id="price" inputmode="numeric" placeholder="Valfritt">
<label>📍 Var finns den?</label><input id="place" placeholder="T.ex. Mehedeby">
<button class="primary" id="go" onclick="makeAd()">✨ Gör min annons</button>
<div class="notice">AI:n får bara uppgifterna ovan och använder dem för att skriva annonsen.</div>
</div>
<div class="card result" id="result">
<div style="font-size:11px;font-weight:850;color:#16784f">DIN FÄRDIGA ANNONS</div>
<h2 id="headline"></h2><div class="price" id="suggested"></div>
<div class="output" id="copy"></div>
<button class="primary" onclick="copyAd()">📋 Kopiera annonsen</button>
<div id="copied" style="text-align:center;color:#16784f;font-weight:800;margin-top:10px"></div>
</div>
</div>
<script>
const file=document.getElementById('file'),photo=document.getElementById('photo');
file.addEventListener('change',()=>{if(file.files[0]){photo.src=URL.createObjectURL(file.files[0]);document.getElementById('drop').style.display='none';document.getElementById('preview').style.display='block'}});
async function makeAd(){
 const go=document.getElementById('go'); go.disabled=true; go.textContent='✨ Skapar annons...';
 const fd=new FormData(); if(file.files[0]) fd.append('image',file.files[0]);
 fd.append('item',document.getElementById('item').value);fd.append('desc',document.getElementById('desc').value);
 fd.append('price',document.getElementById('price').value);fd.append('place',document.getElementById('place').value);
 try{
  const r=await fetch('/api/create-ad',{method:'POST',body:fd}); const data=await r.json();
  if(!r.ok) throw new Error(data.error||'Något gick fel.');
  document.getElementById('headline').textContent=data.headline||'Din annons';
  document.getElementById('suggested').textContent=data.price_suggestion||'';
  document.getElementById('copy').textContent=data.ad_text||'';
  document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});
 }catch(e){alert(e.message)} finally{go.disabled=false;go.textContent='✨ Gör min annons'}
}
async function copyAd(){await navigator.clipboard.writeText(document.getElementById('copy').textContent);document.getElementById('copied').textContent='✓ Kopierad!'}
</script>
</body></html>
